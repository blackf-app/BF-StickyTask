name: release

# Build 3 nền tảng rồi attach vào GitHub Release.
#   - push tag v*        → build + tạo/cập nhật release của tag đó
#   - chạy tay          → build thôi, chỉ upload artifact (không tạo release)
#
# Windows build ở đây vì không build được trên macOS (cần VS 2022 + Desktop C++).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  # Pin đúng version đang dùng ở máy dev để không bị SDK mới làm hỏng build.
  FLUTTER_VERSION: 3.47.2

jobs:
  # ── macOS ───────────────────────────────────────────────────────────────────
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # lib/env.dart bị gitignore nên checkout của CI KHÔNG có nó → build sạch
      # sẵn, không thể nhúng URL/key của dev. Tạo bản rỗng cho chắc.
      - name: Stub lib/env.dart
        run: cp lib/env.example.dart lib/env.dart

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - run: flutter build macos --release

      - name: Zip .app
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent \
            "BF-StickyTask.app" "$GITHUB_WORKSPACE/BF-StickyTask-macos.zip"

      # Logic soi ở tools/scan-secrets.sh — một chỗ duy nhất, dùng chung với
      # tools/build-release.sh. Đừng viết lại regex ở đây.
      - name: Verify không rò URL/key
        run: |
          app="build/macos/Build/Products/Release/BF-StickyTask.app/Contents/Frameworks"
          bash tools/scan-secrets.sh \
            "$app/App.framework/App" \
            "$app/App.framework/Resources/flutter_assets/kernel_blob.bin"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: BF-StickyTask-macos.zip

  # ── Windows ─────────────────────────────────────────────────────────────────
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Stub lib/env.dart
        run: Copy-Item lib/env.example.dart lib/env.dart
        shell: pwsh

      - run: flutter pub get
      - run: flutter build windows --release

      - name: Verify không rò URL/key
        shell: bash
        run: |
          find build/windows -type f \( -name '*.exe' -o -name 'app.so' \) -print0 \
            | xargs -0 bash tools/scan-secrets.sh

      - name: Zip bản Windows
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath BF-StickyTask-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: BF-StickyTask-windows.zip

  # ── Android ─────────────────────────────────────────────────────────────────
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Stub lib/env.dart
        run: cp lib/env.example.dart lib/env.dart

      # Dựng lại keystore + key.properties từ Secrets. Bắt buộc: auto-update
      # cài đè APK, Android chỉ cho cài đè khi chữ ký khớp bản đang cài — ký
      # bằng debug key (debug.keystore sinh mới mỗi runner) là mỗi release một
      # chữ ký khác nhau ⇒ INSTALL_FAILED_UPDATE_INCOMPATIBLE.
      # Thiếu secret thì fail luôn ở đây, đừng để lọt ra release ký debug.
      - name: Dựng keystore ký release
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_B64" ]]; then
            echo "Thiếu secret ANDROID_KEYSTORE_BASE64 — xem mục Cập nhật trong README." >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/bfstickytask-release.jks
          # Không echo mật khẩu: ghi bằng printf vào file, runner sẽ bị xoá sau job.
          {
            printf 'storeFile=bfstickytask-release.jks\n'
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > android/key.properties

      # Flutter 3.47.2 không build được Android cho BẤT KỲ project nào — bug SDK
      # ở :gradle:compileGroovy (flutter#173943, flutter#176077). Script này vá
      # SDK trong runner; nó idempotent và tự báo nếu upstream đã sửa.
      - name: Vá Flutter SDK cho Android
        run: bash tools/patch-flutter-sdk.sh

      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi

      # Chốt lại: APK phải ký bằng đúng key release, không phải debug key. Sai
      # key là user không cài đè được bản mới — thà fail CI còn hơn phát hành.
      #
      # Dùng apksigner chứ không dùng `keytool -printcert -jarfile`: minSdk của
      # Flutter đã lên 24 nên AGP bỏ chữ ký v1 (JAR), keytool đọc đúng v1 thôi
      # và sẽ báo "not a signed jar file" dù APK ký đủ v2/v3.
      - name: Verify APK ký đúng key release
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          [[ -n "$apksigner" ]] || { echo "không thấy apksigner trong build-tools" >&2; exit 1; }

          # Cả hai bên quy về hex thường, không dấu hai chấm, để so trực tiếp:
          # keytool in `7F:7F:26:…`, apksigner in `7f7f26…`.
          want=$(keytool -list -v -keystore android/bfstickytask-release.jks \
                   -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" \
                 | grep -m1 'SHA256:' | sed 's/.*SHA256: *//' | tr -d ':' | tr 'A-F' 'a-f')
          [[ -n "$want" ]] || { echo "không đọc được fingerprint của keystore" >&2; exit 1; }
          echo "keystore  $want"

          for apk in build/app/outputs/flutter-apk/*-release.apk; do
            got=$("$apksigner" verify --print-certs "$apk" \
                  | grep -m1 'SHA-256 digest' | sed 's/.*: *//' | tr 'A-F' 'a-f')
            echo "$(basename "$apk")  $got"
            [[ "$got" == "$want" ]] || { echo "APK ký sai key!" >&2; exit 1; }
          done

      - name: Verify không rò URL/key
        run: |
          for apk in build/app/outputs/flutter-apk/*-release.apk; do
            rm -rf /tmp/apkchk
            unzip -o -q "$apk" -d /tmp/apkchk \
              'assets/flutter_assets/kernel_blob.bin' 'lib/*/libapp.so' 2>/dev/null || true
            echo "gói $(basename "$apk")"
            find /tmp/apkchk -type f -print0 \
              | xargs -0 bash tools/scan-secrets.sh
          done

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: build/app/outputs/flutter-apk/*.apk

  # ── Release ─────────────────────────────────────────────────────────────────
  release:
    needs: [macos, windows, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Gom asset
        run: |
          mkdir -p out
          find dist -type f \( -name '*.zip' -o -name '*.apk' \) -exec cp {} out/ \;
          ls -la out

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
